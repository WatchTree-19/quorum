[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-benchmark"
version = "0.5.0"
description = "Quorum: a benchmark for financial AI under contested ground truth"
authors = [{ name = "Sandeep Singh Rai" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.261",
    "numpy>=1.24",
]

[project.optional-dependencies]
# The out-of-fold logistic baselines in baselines/ and the pilot scripts.
baselines = ["scikit-learn>=1.3"]
# Model provider clients for Inspect runs. Inspect loads these on demand, so
# install the one for the provider you run against.
openai = ["openai>=1.99"]
anthropic = ["anthropic>=0.60"]

[project.entry-points.inspect_ai]
quorum_eval = "quorum_eval"

[project.urls]
Homepage = "https://github.com/WatchTree-19/quorum"

[tool.setuptools]
packages = ["quorum", "quorum.llm", "quorum.adapters", "grader_reliability", "quorum_eval"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
